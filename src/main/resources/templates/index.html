<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cinema Website</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="description" content="Welcome to the best cinema website for movies, series, and animes!">

    <meta property="og:title" content="Cinema Website">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.cinema.com">
    <meta property="og:image" content="https://www.cinema.com/images/logo.png">
    <meta property="og:image:alt" content="Cinema Logo">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#fafafa">
</head>

<body>

<header>
    <div id="top" class="Wrapper">
    </div>
    <div>
        <img src="https://www.cinema.de/themes/custom/cinema_www/images/logos/logo_240.png" alt="Cinema Logo" />
    </div>
    <p class="main-par">Welcome to my Cinema website</p>

    <section id="login-signup">
        <div class="wrapper">
            <div class="auth-buttons">
                <button class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
                <button class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Log In
                </button>
            </div>
        </div>
    </section>

    <section id="language-selector">
        <div class="wrapper">
            <div id="lang-select">
                <select th:value="${selectedLanguage}">
                    <option value="en">English</option>
                    <option value="es">Deutsch</option>
                    <option value="fr">فارسی</option>
                </select>
                <i class="fas fa-globe-americas"></i>
            </div>
        </div>
    </section>

    <div class="wrapper">
        <ul id="main-nav">
            <li><a href="" th:classappend="${activeNav == 'suggestion' ? 'active' : ''}">Our suggestion</a></li>
            <li><a href="" th:classappend="${activeNav == 'best-of-week' ? 'active' : ''}">Best of the week</a></li>
            <li><a href="" th:classappend="${activeNav == 'actors-of-week' ? 'active' : ''}">Actors of the week</a></li>
        </ul>
    </div>
</header>

<main class="wrapper">
    <div class="content">
        <div id="filter">
            <h4>Choose whatever you want</h4>
            <p>Sorted by</p>
            <div class="input-group">
                <label>
                    <input type="radio" name="sort" th:checked="${sort == 'best-films'}"> Best films
                </label>
                <label>
                    <input type="radio" name="sort" th:checked="${sort == 'best-series'}"> Best series
                </label>
                <label>
                    <input type="radio" name="sort" th:checked="${sort == 'best-animes'}"> Best animes
                </label>
            </div>

            <p>Offers</p>
            <div class="input-group">
                <label>
                    <input type="checkbox" name="move-review" th:checked="${moveReview}"> Movies to review
                </label>
                <label>
                    <input type="checkbox" name="series-review" th:checked="${seriesReview}"> Series to review
                </label>
                <label>
                    <input type="checkbox" name="animes-review" th:checked="${animesReview}"> Animes to review
                </label>
            </div>

            <p>Categories</p>
            <div class="input-group">
                <label>
                    <input type="checkbox" th:checked="${categories.contains('action')}"> Action
                </label>
                <label>
                    <input type="checkbox" th:checked="${categories.contains('horror')}"> Horror
                </label>
                <label>
                    <input type="checkbox" th:checked="${categories.contains('comedy')}"> Comedy
                </label>
            </div>
        </div>

        <div id="image">
            <img th:src="@{${moviePosterUrl}}" alt="Movie Poster">
        </div>
    </div>
</main>

<div id="search">
    <label for="search-input">
        <span class="sr-only">Search</span>
    </label>
    <input type="text" id="search-input" placeholder="Search movies or series" th:value="${searchQuery}">
</div>

<section id="categories">
    <div class="section-headline">Categories</div>
    <div class="lane">
        <div class="lane-wrapper">
            <ul class="category-list">
                <li th:each="category : ${categories}">
                    <div class="category-item">
                        <img th:src="@{${category.file}}" alt="Category Image">
                        <p th:text="${category.name}"></p>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</section>

<section id="movies">
    <div class="section-headline">All Movies</div>
    <div class="card-wrapper">


        <div class="movie-item" th:each="movie : ${movies}">
            <div class="top"
                 th:style="|background-image:
         url('/files/${movie?.image != null ? movie.image.id : 'default-image-id'}')|">
                <div class="right">
                    <button class="heart">
                        <object data="img/heart.svg"></object>
                    </button>
                    <span class="ad">Show</span>
                </div>
            </div>

            <div class="bottom">
                <div>
                    <div class="title" th:text="${movie.title}"></div>
                    <div class="rating">
                        <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"></svg>
                        <span th:text="${movie.rating}"></span> <span>(<span th:text="${movie.reviewsCount}"></span>+)</span>
                    </div>
                </div>
                <div class="underline-category">
                    <span th:text="${movie.category}"></span>
                </div>
            </div>
        </div>
    </div>
</section>

<footer>
    <div class="footer-content">
        <p><strong>Contact Information:</strong></p>
        <p><strong>Address:</strong> Graz, Österreich</p>
        <p><strong>Email:</strong> <a href="mailto:armin@cinema.com">armin@cinema.com</a></p>
        <p><strong>Phone:</strong> +43 20 30 40 50</p>

        <div class="social-icons">
            <a href="https://www.facebook.com" target="_blank" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com" target="_blank" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>
</footer>

</body>
</html>
