<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cinema Website</title>
    <link rel="stylesheet" href="/css/style.css">
    <meta name="description" content="Welcome to the best cinema website for movies, series, and animes!">

    <meta property="og:title" content="Cinema Website">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.cinema.com">
    <meta property="og:image" content="https://www.cinema.com/images/logo.png">
    <meta property="og:image:alt" content="Cinema Logo">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#fafafa">

</head>

<body>

<header>
    <div id="top" class="Wrapper">
    </div>
    <div>
        <img src="https://www.cinema.de/themes/custom/cinema_www/images/logos/logo_240.png" alt="Cinema Logo"/>
    </div>
    <p class="main-par" th:text="#{welcome.message}">title will be translated</p>


    <section id="login-signup">
        <div class="wrapper">
            <div class="auth-buttons">
                <button class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
                <button class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Log In
                </button>
            </div>
        </div>
    </section>

    <section id="language-selector">
        <div class="wrapper">
            <div id="lang-select">
                <form action="" method="get">
                    <select name="lang" onchange="this.form.submit()">
                        <option value="en" th:selected="${#locale.language == 'en'}">English</option>
                        <option value="de" th:selected="${#locale.language == 'de'}">Deutsch</option>
                        <option value="fa" th:selected="${#locale.language == 'fa'}">فارسی</option>
                    </select>
                </form>
                <i class="fas fa-globe-americas"></i>
            </div>
        </div>
    </section>
</header>

<main class="wrapper">
    <div class="content">
        <div id="filter">
            <h4>Choose whatever you want</h4>
            <p>Sorted by</p>
            <div class="input-group">
                <label>
                    <input type="radio" name="sort" th:checked="${sort == 'best-films'}"> Best films
                </label>
                <label>
                    <input type="radio" name="sort" th:checked="${sort == 'best-series'}"> Best series
                </label>
                <label>
                    <input type="radio" name="sort" th:checked="${sort == 'best-animes'}"> Best animes
                </label>
            </div>

            <p>Offers</p>
            <div class="input-group">
                <label>
                    <input type="checkbox" name="move-review" th:checked="${moveReview}"> Movies to review
                </label>
                <label>
                    <input type="checkbox" name="series-review" th:checked="${seriesReview}"> Series to review
                </label>
                <label>
                    <input type="checkbox" name="animes-review" th:checked="${animesReview}"> Animes to review
                </label>
            </div>

            <p>Categories</p>
            <div class="input-group">
                <label>
                    <input type="checkbox" th:checked="${categories != null and categories.contains('action')}"> For
                    fanatsy lovers
                </label>
                <label>
                    <input type="checkbox" th:checked="${categories != null and categories.contains('horror')}"> Are you
                    scared?
                </label>
                <label>
                    <input type="checkbox" th:checked="${categories != null and categories.contains('comedy')}"> Happy
                    and Funny
                </label>
            </div>
        </div>

        <div id="image-slider" class="slider">
            <div class="slides">
                <img src="https://image.tmdb.org/t/p/w500/q719jXXEzOoYaps6babgKnONONX.jpg" alt="Movie Poster 1">
                <img src="https://image.tmdb.org/t/p/w500/5KCVkau1HEl7ZzfPsKAPM0sMiKc.jpg" alt="Movie Poster 4">
                <img src="https://image.tmdb.org/t/p/w500/8UlWHLMpgZm9bx6QYh0NFoq67TZ.jpg" alt="Movie Poster 2">
                <img src="https://image.tmdb.org/t/p/w500/6KErczPBROQty7QoIsaa6wJYXZi.jpg" alt="Movie Poster 3">
                <img src="https://image.tmdb.org/t/p/w500/5KCVkau1HEl7ZzfPsKAPM0sMiKc.jpg" alt="Movie Poster 5">
            </div>
        </div>
        <script src="/js/slider.js"></script>
    </div>
</main>

<div id="search">
    <form id="search-form" action="/search" method="get">
        <label for="search-input">
            <span class="sr-only"></span>
        </label>
        <input type="text" id="search-input" name="query" placeholder="Search movies or series"
               th:value="${searchQuery}">
    </form>
</div>

<section id="categories">
    <div class="section-headline">Categories</div>
    <div class="lane">
        <div class="lane-wrapper">
            <ul class="category-list">
                <li th:each="category : ${categories}">
                    <div class="category-item">
                        <a th:href="@{'/category/' + ${category.name}}">
                            <img th:src="@{'/files/' + ${category.file != null ? category.file.id : 'default-image-id'}}"
                                 alt="">
                            <p th:text="${category.name}"></p>
                        </a>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</section>

<section id="movies">
    <div class="section-headline">All Movies</div>
    <div class="card-wrapper">


        <div class="movie-item" th:each="movie : ${movies}">
            <a th:href="@{'/movie/' + ${movie.id}}">
                <div class="top"
                     th:style="|background-image:
         url('/files/${movie?.image != null ? movie.image.id : 'default-image-id'}')|">
                </div>

                <div class="bottom">
                    <div>
                        <div class="title" th:text="${movie.title}"></div>
                        <div class="rating">
                            <svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"></svg>
                            <span th:text="${movie.rating}"></span> <span>(<span
                                th:text="${movie.reviewsCount}"></span>+)</span>
                        </div>
                    </div>
                    <div class="underline-category">
                        <span th:text="${movie.category != null ? movie.category.name : 'No Category'}"></span>
                    </div>

                    <div class="movie-details">
                        <div><strong>Genre:</strong> <span th:text="${movie.genre}"></span></div>
                        <div><strong>Director:</strong> <span th:text="${movie.director}"></span></div>
                        <div><strong>Cast:</strong> <span th:text="${movie.cast}"></span></div>
                    </div>
                </div>
            </a>
        </div>
    </div>
</section>

<footer>
    <div class="footer-content">
        <p><strong>Contact Information:</strong></p>
        <p><strong>Address:</strong> Graz, Österreich</p>
        <p><strong>Email:</strong> <a href="mailto:armin@cinema.com">armin@cinema.com</a></p>
        <p><strong>Phone:</strong> +43 20 30 40 50</p>

        <div class="social-icons">
            <a href="https://www.facebook.com" target="_blank" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com" target="_blank" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
    </div>
</footer>

</body>
</html>
