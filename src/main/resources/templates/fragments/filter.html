<div id="filter" th:fragment="filter(categories)">
    <h4>Choose whatever you want</h4>


    <p>Sorted by</p>
    <div class="input-group">
        <label>
            <input type="radio" name="sort" value="best-of-the-year" th:checked="${sortOption == 'best-of-the-year'}">
            Best of the year
        </label>
        <label>
            <input type="radio" name="sort" value="best-of-the-month" th:checked="${sortOption == 'best-of-the-month'}">
            Best of the month
        </label>
    </div>


    <p>Offers</p>
    <div class="input-group">
        <label>
            <input type="checkbox" name="free-delivery" th:checked="${freeDelivery}"> Free movies to watch
        </label>
        <label>
            <input type="checkbox" name="accept-voucher" th:checked="${acceptVoucher}"> Free series to watch
        </label>
        <label>
            <input type="checkbox" name="offers" th:checked="${offers}"> Free animes to watch
        </label>
    </div>


    <p>Categories</p>
    <div class="input-group">
        <label th:each="category : ${categories}">
            <input type="checkbox" name="category" th:value="${category.id}" th:checked="${category.selected}">
            <span th:text="${category.name}"></span>
        </label>
    </div>
</div>
