<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Administration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
    <h1>Administration Dashboard</h1>


    <div class="mt-4">
        <h2>Manage Movies</h2>
        <div class="d-flex justify-content-end mb-2">
            <a href="/administration/movie/create" class="btn btn-success">Create New Movie</a>
        </div>
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Title</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="movie : ${movies}">
                <td th:text="${movie.title}"></td>
                <td>
                    <a th:href="@{/administration/movie/{id}/update(id=${movie.id})}" class="btn btn-primary">Edit</a>
                    <a th:href="@{/administration/movie/{id}/delete(id=${movie.id})}" class="btn btn-danger">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>


    <div class="mt-4">
        <h2>Manage Categories</h2>
        <div class="d-flex justify-content-end mb-2">
            <a th:href="${'/administration/movie/create'}" class="btn btn-success">Create New Category</a>
        </div>
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Name</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.name}"></td>
                <td>
                    <a th:href="@{/administration/category/{id}/update(id=${category.id})}"
                       class="btn btn-primary">Edit</a>
                    <a th:href="@{/administration/category/{id}/delete(id=${category.id})}" class="btn btn-danger">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
