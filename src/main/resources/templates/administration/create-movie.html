<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${movie != null ? 'Edit Movie' : 'Create Movie'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        td {
            vertical-align: middle;
        }
    </style>
</head>
<body>
<div class="container">

    <div class="row">
        <div class="col-12">
            <h1 th:text="${movie != null ? 'Edit Movie' : 'Create Movie'}">Create Movie</h1>
        </div>
    </div>

    <div class="row">
        <div class="col-12 col-md-5">

            <form th:action="${movie != null ? '/administration/movie/' + movie.id + '/update' : '/administration/movie/create'}"
                  method="post"
                  class="mt-4"
                  enctype="multipart/form-data">

                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input th:value="${movie?.title}"
                           type="text" class="form-control" id="title" name="title" required>
                </div>

                <div class="mb-3">
                    <label for="genre" class="form-label">Genre</label>
                    <input th:value="${movie?.genre}"
                           type="text" class="form-control" id="genre" name="genre" required>
                </div>

                <div class="mb-3">
                    <label for="releaseDate" class="form-label">Release Date</label>
                    <input th:value="${movie?.releaseDate}"
                           type="date" class="form-control" id="releaseDate" name="releaseDate" required>
                </div>

                <div class="mb-3">
                    <label for="rating" class="form-label">Rating</label>
                    <input th:value="${movie?.rating}"
                           type="number" step="0.1" min="1" max="10" class="form-control" id="rating" name="rating"
                           required>
                </div>

                <div class="mb-3">
                    <label for="duration" class="form-label">Duration (minutes)</label>
                    <input th:value="${movie?.duration}"
                           type="number" class="form-control" id="duration" name="duration" required>
                </div>

                <div class="mb-3">
                    <label for="file" class="form-label">Movie Poster</label>
                    <input type="file" class="form-control" id="file" name="file"
                           th:required="${movie != null ? false : 'required'}">
                </div>

                <button type="submit" class="btn btn-primary">Save</button>
            </form>

        </div>

        <div class="col-12 col-md-7">
            <div class="row">
                <div class="col-12">
                    <h3>Actors</h3>
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>Photo</th>
                            <th>Name</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="actor : ${movie?.actors}">
                            <td style="width: 140px;">
                                <img
                                        th:src="@{'/files/' + ${actor.photo != null ? actor.photo.id : 'default-photo-id'}}"
                                        alt="" height="64">
                            </td>
                            <td th:text="${actor.name}"></td>
                            <td>
                                <div class="d-flex justify-content-end gap-2">
                                    <a th:href="${'http://localhost:8080/administration/movie/'+movie.id+'/actor/' + actor.id + '/update'}"
                                       class="btn btn-primary">Edit</a>
                                    <a th:href="${'http://localhost:8080/administration/movie/'+movie.id+'/actor/' + actor.id + '/delete'}"
                                       class="btn btn-danger">Delete</a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="row">
                <div class="col-12 d-flex justify-content-end">
                    <a th:href="${'/administration/movie/' + movie?.id + '/actor/create'}" class="btn btn-success">Add
                        New Actor</a>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
