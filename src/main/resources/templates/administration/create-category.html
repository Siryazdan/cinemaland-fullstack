<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${category == null ? 'Create Category' : 'Edit Category'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${category == null ? 'Create Category' : 'Edit Category'}">Create Category</h1>
    <form th:action="${category != null ? '/administration/category/'+ category.id + '/update': '/administration/category/create'}" method="post" class="mt-4" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${category?.name}" required>
        </div>

        <div class="mb-3">
            <label for="file" class="form-label">Category photo</label>
            <input type="file" class="form-control" id="file" name="file" th:required="${category == null ? 'required' : false}">
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>

</body>
</html>
