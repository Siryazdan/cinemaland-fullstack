<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Welcome to Your Dashboard</h1>

    <div class="d-flex justify-content-end mb-3">
        <a href="/dashboard/movie/create" class="btn btn-success">Add New Movie</a>
    </div>

    <div th:if="${movies.size() == 0}">
        <p>You haven’t added any movies yet.</p>
    </div>

    <table th:if="${movies.size() > 0}" class="table table-striped">
        <thead>
        <tr>
            <th>Title</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="movie : ${movies}">
            <td th:text="${movie.title}">Movie Title</td>
            <td>
                <!-- Optional: add edit/delete per user -->
                <a th:href="@{/dashboard/movie/{id}/edit(id=${movie.id})}" class="btn btn-primary">Edit</a>
                <a th:href="@{/dashboard/movie/{id}/delete(id=${movie.id})}" class="btn btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
