<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${category == null ? 'New category' : 'Edit ' + category.name})}"></head>
<body id="top">

<header th:replace="~{fragments/layout :: nav('collection')}"></header>

<main class="page">
    <div class="page-header">
        <div>
            <a class="eyebrow" th:href="@{/administration}"><i class="fas fa-arrow-left"></i> My Collection</a>
            <h1 class="page-title" th:if="${category == null}">New <span class="gradient-text">category</span></h1>
            <h1 class="page-title" th:if="${category != null}">Edit <span class="gradient-text" th:text="${category.name}">category</span></h1>
            <p class="page-sub">Group your movies any way you like: by genre, by mood, by who you watch them with.</p>
        </div>
    </div>

    <form class="panel narrow"
          th:action="${category != null ? '/administration/category/' + category.id + '/update' : '/administration/category/create'}"
          method="post" enctype="multipart/form-data">

        <div class="form-grid">
            <div class="field full">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" th:value="${category?.name}" maxlength="255" required
                       placeholder="e.g. Rainy Sunday">
            </div>

            <div class="field full">
                <label for="file">Cover image</label>
                <div class="file-drop">
                    <div class="thumb wide">
                        <img th:if="${category != null and category.file != null}" th:src="@{/files/{id}(id=${category.file.id})}" alt="Current image">
                        <i class="fas fa-image" th:unless="${category != null and category.file != null}"></i>
                    </div>
                    <div>
                        <input type="file" id="file" name="file" accept="image/*">
                        <div class="hint" th:text="${category != null and category.file != null} ? 'Choose a file only if you want to replace the image.' : 'Optional. A wide picture looks best.'">Optional</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-floppy-disk"></i>
                <span th:text="${category == null ? 'Create category' : 'Save changes'}">Save</span></button>
            <a class="btn btn-ghost btn-lg" th:href="@{/administration}">Cancel</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
