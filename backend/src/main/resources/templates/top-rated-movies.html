<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Rated Movies</title>
  <link rel="stylesheet" href="/css/top-rated-movies-list.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<header>
  <h1>Top Rated Movies</h1>
</header>
<main>
  <div id="background"></div>
  <div class="movie-list">
    <div th:each="movie : ${movies}">
      <div class="movie-item">
        <a th:href="@{'/movie/' + ${movie.id}}">
          <img th:src="@{'/files/' + ${movie.image != null ? movie.image.id : 'default-image-id'}}" alt="" height="128">
          <h2 th:text="${movie.title}"></h2>
          <p><strong>Rating:</strong> <span th:text="${movie.rating}"></span> <i class="fas fa-star"></i></p>
        </a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
