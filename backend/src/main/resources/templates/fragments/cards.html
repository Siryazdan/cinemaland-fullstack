<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Poster image with a placeholder when the movie has no picture -->
<div th:fragment="poster(movie)" class="poster">
    <img th:if="${movie.image != null}" th:src="@{/files/{id}(id=${movie.image.id})}"
         th:alt="|Poster of ${movie.title}|" loading="lazy">
    <div class="poster-fallback" th:unless="${movie.image != null}">
        <i class="fas fa-film"></i>
        <span th:text="${movie.title}">Title</span>
    </div>
    <span class="rating-badge" th:if="${!#strings.isEmpty(movie.rating)}">
        <i class="fas fa-star"></i> <span th:text="${movie.rating}">8.5</span>
    </span>
</div>

<!-- Clickable movie card: poster + title + category -->
<a th:fragment="movieCard(movie)" class="movie-card" th:href="@{/movie/{id}(id=${movie.id})}">
    <div th:replace="~{fragments/cards :: poster(${movie})}"></div>
    <div class="card-title" th:text="${movie.title}">Title</div>
    <div class="card-meta"
         th:text="${movie.category != null ? movie.category.name : (#strings.isEmpty(movie.genre) ? 'Movie' : movie.genre)}">Category</div>
</a>

<!-- Round photo with initials as placeholder -->
<div th:fragment="avatar(actor)" class="avatar">
    <img th:if="${actor.image != null}" th:src="@{/files/{id}(id=${actor.image.id})}"
         th:alt="${actor.name}" loading="lazy">
    <span th:unless="${actor.image != null}" th:text="${#strings.substring(actor.name + '?', 0, 1)}">A</span>
</div>

</body>
</html>
