<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" href="/css/style.css">
<head>
    <title>Movie Details</title>
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --gray-color: #6c757d;
            --success-color: #4bb543;
            --error-color: #f44336;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.12);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--dark-color);
            padding-bottom: 40px;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Canvas Background */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ed 100%);
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 992px) {
            main {
                grid-template-columns: 1fr 1fr;
            }
        }

        .movie-poster {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            height: fit-content;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        .movie-poster:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .movie-poster img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .movie-details {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow-md);
        }

        .movie-details p {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .movie-details strong {
            color: var(--primary-color);
            font-weight: 600;
        }

        .section-title {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent-color);
            display: inline-block;
        }

        /* RESTORED COMMENT STYLES */
        #comments {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var (--shadow-md);
            margin-top: 1rem;
        }

        #comment-list {
            margin-bottom: 2rem;
        }

        .comment {
            background: var(--light-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            border-left: 4px solid var(--accent-color);
        }

        .comment:hover {
            transform: translateX(5px);
        }

        .comment-author {
            font-weight: 600;
            color: var(--secondary-color);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
        }

        .comment-author::before {
            content: "👤";
            margin-right: 8px;
        }

        .comment-text {
            color: var(--dark-color);
            margin-bottom: 1rem;
        }

        .comment-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .btn-danger {
            background-color: var(--error-color);
            color: white;
        }

        .btn-danger:hover {
            background-color: #d32f2f;
            transform: translateY(-2px);
        }

        #comment-form {
            background: var(--light-color);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--secondary-color);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            font-size: 1.1rem;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .movie-poster, .movie-details, #comments {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .movie-details {
            animation-delay: 0.2s;
        }

        #comments {
            animation-delay: 0.4s;
        }

        /* Comment Animation */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .comment {
            animation: slideIn 0.4s ease-out forwards;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .movie-details p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<!-- Canvas for JavaScript animated background -->
<canvas id="canvas-bg"></canvas>

<header>
    <h1 th:text="${movie.title}">Movie Title</h1>
</header>
<main>
    <div class="movie-poster">
        <img th:src="@{'/files/' + ${movie?.image != null ? movie.image.id : 'default-image-id'}}" alt="Movie Poster">
    </div>
    <div class="movie-details">
        <h2 class="section-title">Movie Information</h2>
        <p><strong>Genre:</strong> <span th:text="${movie.genre}"></span></p>
        <p><strong>Category:</strong> <span
                th:text="${movie.category != null ? movie.category.name : 'No Category'}"></span></p>
        <p><strong>Director:</strong> <span th:text="${movie.director}"></span></p>
        <p><strong>Synopsis:</strong> <span th:text="${movie.synopsis}"></span></p>
        <p><strong>Cast:</strong> <span th:text="${movie.cast}"></span></p>

        <!-- Buttons for Trailer and IMDb -->
        <p><strong>Trailer:</strong> <a th:href="${youtubeTrailerLink}" target="_blank" class="btn btn-primary">Watch
            Trailer</a></p>

    </div>

    <div id="comments">
        <h2 class="section-title">Comments</h2>
        <div id="comment-list"></div>

        <h3 class="section-title">What do you think about it?</h3>
        <button id="toggle-comment-form" class="btn btn-primary">+</button>
        <div id="comment-form-container" style="display: none;">
            <form id="comment-form">
                <input type="hidden" id="movie-id" name="movie-id" th:value="${movie.id}">
                <div class="form-group">
                    <label for="text" class="form-label">Review:</label>
                    <textarea id="text" name="text" rows="4" class="form-control" required></textarea>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary submit-btn">Submit Review</button>
                </div>
            </form>
        </div>
    </div>
</main>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggleButton = document.getElementById('toggle-comment-form');
        const commentFormContainer = document.getElementById('comment-form-container');

        toggleButton.addEventListener('click', function () {
            if (commentFormContainer.style.display === 'none' || commentFormContainer.style.display === '') {
                commentFormContainer.style.display = 'block';
                toggleButton.textContent = '-';
            } else {
                commentFormContainer.style.display = 'none';
                toggleButton.textContent = '+';
            }
        });
    });

    // ======================
    // Animated Background
    // ======================
    document.addEventListener('DOMContentLoaded', function () {
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');

        // Set canvas to full window size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Particle system
        const particles = [];
        const particleCount = window.innerWidth < 768 ? 30 : 60;
        const colors = [
            'rgba(67, 97, 238, 0.3)',
            'rgba(63, 55, 201, 0.3)',
            'rgba(72, 149, 239, 0.3)'
        ];

        // Particle class
        class Particle {
            constructor() {
                this.reset();
                this.size = Math.random() * 5 + 2;
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = Math.random() * 2 - 1;
                this.vy = Math.random() * 2 - 1;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * 0.5 + 0.1;
                this.life = Math.random() * 100 + 100;
                this.currentLife = 0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                // Fade in/out based on life
                this.currentLife++;
                if (this.currentLife >= this.life) {
                    this.reset();
                } else if (this.currentLife < 20) {
                    this.alpha = (this.currentLife / 20) * 0.6;
                } else if (this.currentLife > this.life - 20) {
                    this.alpha = ((this.life - this.currentLife) / 20) * 0.6;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
                ctx.closePath();
            }
        }

        // Create particles
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw connecting lines between nearby particles
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 150) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(67, 97, 238, ${1 - distance / 150})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.closePath();
                    }
                }
            }

            // Update and draw particles
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        // Handle window resize
        window.addEventListener('resize', function () {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start animation
        animate();

        // ======================
        // Comments Functionality
        // ======================
        const commentForm = document.getElementById('comment-form');
        const commentList = document.getElementById('comment-list');
        const movieId = document.getElementById('movie-id').value;

        // Load comments from local storage
        const loadComments = () => {
            const comments = JSON.parse(localStorage.getItem('comments')) || [];
            commentList.innerHTML = '';
            comments.filter(comment => comment.movieId === movieId).forEach((comment, index) => {
                const commentDiv = document.createElement('div');
                commentDiv.className = 'comment';
                commentDiv.style.animationDelay = `${index * 0.1}s`;
                commentDiv.innerHTML = `
                <p class="comment-text">${comment.text}</p>
                <div class="comment-actions">
                    <button class="btn btn-primary" onclick="editComment(${index})">Edit</button>
                    <button class="btn btn-danger" onclick="deleteComment(${index})">Delete</button>
                </div>
            `;
                commentList.appendChild(commentDiv);
            });
        };

        // Save comments to local storage
        const saveComments = (comments) => {
            localStorage.setItem('comments', JSON.stringify(comments));
            loadComments();
        };

        // Add a new comment
        commentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = document.getElementById('text').value;
            const comments = JSON.parse(localStorage.getItem('comments')) || [];
            comments.unshift({text, movieId});
            saveComments(comments);
            commentForm.reset();

            // Show temporary success message
            const submitBtn = document.querySelector('#comment-form button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Comment Added!';
            submitBtn.style.backgroundColor = 'var(--success-color)';
            setTimeout(() => {
                submitBtn.textContent = originalText;
                submitBtn.style.backgroundColor = 'var(--primary-color)';
            }, 2000);
        });

        // Edit a comment
        window.editComment = (index) => {
            const comments = JSON.parse(localStorage.getItem('comments'));
            const comment = comments[index];
            if (comment.movieId === movieId) {
                const newText = prompt('Edit your comment:', comment.text);
                if (newText !== null) {
                    comments[index].text = newText;
                    saveComments(comments);
                }
            }
        };

        // Delete a comment
        window.deleteComment = (index) => {
            const comments = JSON.parse(localStorage.getItem('comments'));
            if (comments[index].movieId === movieId && confirm('Are you sure you want to delete this comment?')) {
                comments.splice(index, 1);
                saveComments(comments);
            }
        };

        loadComments();
    });
</script>

</body>
</html>
