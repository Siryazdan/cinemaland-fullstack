<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${movie.title})}"></head>
<body id="top">

<header th:replace="~{fragments/layout :: nav('home')}"></header>

<main>
    <section class="detail-hero">
        <div class="hero-backdrop" th:if="${movie.image != null}"
             th:style="'background-image: url(' + @{/files/{id}(id=${movie.image.id})} + ')'"></div>

        <div class="detail-inner">
            <div th:replace="~{fragments/cards :: poster(${movie})}"></div>

            <div>
                <a class="eyebrow" th:href="@{/#movies}"><i class="fas fa-arrow-left"></i> All movies</a>
                <h1 class="detail-title" th:text="${movie.title}">Movie Title</h1>

                <div class="detail-meta">
                    <span class="big-rating" th:if="${!#strings.isEmpty(movie.rating)}">
                        <i class="fas fa-star"></i><span th:text="${movie.rating}">8.5</span><small>/ 10</small>
                    </span>
                    <a class="chip chip-accent" th:if="${movie.category != null}"
                       th:href="@{/category/{name}(name=${movie.category.name})}">
                        <i class="fas fa-layer-group"></i><span th:text="${movie.category.name}">Category</span>
                    </a>
                    <span class="chip" th:if="${!#strings.isEmpty(movie.genre)}" th:text="${movie.genre}">Genre</span>
                </div>

                <p class="synopsis" th:if="${!#strings.isEmpty(movie.synopsis)}" th:text="${movie.synopsis}">Synopsis</p>

                <div class="facts">
                    <div class="fact" th:if="${!#strings.isEmpty(movie.director)}">
                        <small>Director</small><span th:text="${movie.director}">Director</span>
                    </div>
                    <div class="fact" th:if="${!#strings.isEmpty(movie.cast)}">
                        <small>Starring</small><span th:text="${movie.cast}">Cast</span>
                    </div>
                </div>

                <div class="detail-actions">
                    <a th:href="${youtubeTrailerLink}" target="_blank" rel="noopener" class="btn btn-primary btn-lg">
                        <i class="fab fa-youtube"></i> Watch trailer
                    </a>
                    <a th:href="@{/administration/movie/{id}/update(id=${movie.id})}" class="btn btn-ghost btn-lg">
                        <i class="fas fa-pen"></i> Edit movie
                    </a>
                </div>
            </div>
        </div>
    </section>

    <div class="page" style="padding-top: 0;">

        <!-- Cast -->
        <section class="section" style="margin-top: 16px;" th:if="${!#lists.isEmpty(movie.actors)}">
            <div class="section-head">
                <h2 class="section-title"><i class="fas fa-masks-theater"></i> Cast</h2>
                <a class="section-link" th:href="@{/actors}">All actors <i class="fas fa-arrow-right"></i></a>
            </div>
            <div class="cast-row">
                <div class="cast-member" th:each="actor : ${movie.actors}">
                    <div th:replace="~{fragments/cards :: avatar(${actor})}"></div>
                    <b th:text="${actor.name}">Name</b>
                    <span th:if="${actor.age > 0}" th:text="|${actor.age} years|">40 years</span>
                </div>
            </div>
        </section>

        <!-- More like this -->
        <section class="section" th:if="${!#lists.isEmpty(similar)}">
            <div class="section-head">
                <h2 class="section-title"><i class="fas fa-clone"></i> More like this</h2>
                <a class="section-link" th:href="@{/category/{name}(name=${movie.category.name})}">
                    See all in <span th:text="${movie.category.name}">category</span> <i class="fas fa-arrow-right"></i></a>
            </div>
            <div class="movie-row">
                <th:block th:each="m : ${similar}"><a th:replace="~{fragments/cards :: movieCard(${m})}"></a></th:block>
            </div>
        </section>

        <!-- Personal notes (stored only in this browser) -->
        <section class="section" id="notes">
            <div class="section-head">
                <h2 class="section-title"><i class="fas fa-pen-to-square"></i> My notes</h2>
            </div>
            <div class="notes">
                <form class="note-form" id="note-form">
                    <label for="note-text" class="sr-only">Your note</label>
                    <textarea id="note-text" maxlength="2000" required
                              placeholder="What did you think? Favorite scene? Who should you watch it with next time?"></textarea>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Save note</button>
                    <p class="hint"><i class="fas fa-lock"></i> Notes are private and saved only in this browser.</p>
                </form>
                <div>
                    <div class="note-list" id="note-list"></div>
                    <p class="hint" id="no-notes">No notes for this movie yet.</p>
                </div>
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:inline="javascript">
    (function () {
        const movieId = /*[[${movie.id}]]*/ 'id';
        const KEY = 'cinemaland-notes-' + movieId;
        const list = document.getElementById('note-list');
        const empty = document.getElementById('no-notes');
        const form = document.getElementById('note-form');
        const input = document.getElementById('note-text');

        function load() {
            try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
        }

        function save(notes) {
            try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) { /* storage unavailable */ }
            render();
        }

        function render() {
            const notes = load();
            list.replaceChildren();
            empty.hidden = notes.length > 0;
            notes.forEach(function (text, index) {
                const item = document.createElement('div');
                item.className = 'note';
                const p = document.createElement('p');
                p.textContent = text;            // plain text only, never HTML
                const actions = document.createElement('div');
                actions.className = 'note-actions';

                const edit = document.createElement('button');
                edit.type = 'button';
                edit.className = 'btn btn-ghost btn-sm';
                edit.innerHTML = '<i class="fas fa-pen"></i> Edit';
                edit.addEventListener('click', function () {
                    const changed = prompt('Edit your note:', text);
                    if (changed !== null && changed.trim()) {
                        const all = load();
                        all[index] = changed.trim();
                        save(all);
                    }
                });

                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'btn btn-danger btn-sm';
                del.innerHTML = '<i class="fas fa-trash"></i> Delete';
                del.addEventListener('click', function () {
                    if (confirm('Delete this note?')) {
                        const all = load();
                        all.splice(index, 1);
                        save(all);
                    }
                });

                actions.append(edit, del);
                item.append(p, actions);
                list.appendChild(item);
            });
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;
            const all = load();
            all.unshift(text);
            save(all);
            form.reset();
        });

        // move notes saved by the old comments feature into the new per-movie list (once)
        try {
            const old = JSON.parse(localStorage.getItem('comments')) || [];
            const mine = old.filter(function (c) { return c && c.movieId === movieId && c.text; });
            if (mine.length) {
                save(load().concat(mine.map(function (c) { return String(c.text); })));
                localStorage.setItem('comments', JSON.stringify(old.filter(function (c) { return !(c && c.movieId === movieId); })));
            }
        } catch (e) { /* nothing to migrate */ }

        render();
    })();
</script>
</body>
</html>
