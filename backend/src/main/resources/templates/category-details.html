<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${categoryName})}"></head>
<body id="top">

<header th:replace="~{fragments/layout :: nav('home')}"></header>

<main>
    <section class="home-hero" style="min-height: 340px;">
        <div class="hero-backdrop" th:if="${category != null and category.file != null}"
             th:style="'background-image: url(' + @{/files/{id}(id=${category.file.id})} + ')'"></div>
        <div class="hero-inner">
            <div class="hero-greeting">
                <a class="eyebrow" th:href="@{/#categories}"><i class="fas fa-arrow-left"></i> All categories</a>
                <h1 th:text="${categoryName}">Category</h1>
                <p th:text="${#lists.size(movies) == 1 ? '1 movie in this category' : #lists.size(movies) + ' movies in this category'}">0 movies</p>
            </div>
        </div>
    </section>

    <div class="page" style="padding-top: 8px;">
        <div class="movie-grid" th:if="${!#lists.isEmpty(movies)}">
            <th:block th:each="movie : ${movies}"><a th:replace="~{fragments/cards :: movieCard(${movie})}"></a></th:block>
        </div>

        <div class="empty" th:if="${#lists.isEmpty(movies)}">
            <i class="fas fa-box-open big"></i>
            <h3>No movies here yet</h3>
            <p>Add a movie and pick this category for it.</p>
            <div class="empty-actions">
                <a class="btn btn-primary" th:href="@{/administration/movie/create}"><i class="fas fa-plus"></i> Add a movie</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
