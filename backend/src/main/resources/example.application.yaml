# Example configuration. Instead of editing application.yaml you can also just set
# the environment variables DB_URL, DB_USERNAME, DB_PASSWORD, UPLOAD_DIR, FLYWAY_ENABLED.
spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/cinemaland
    username: [YOUR_USERNAME]
    password: [YOUR_PASSWORD]
  flyway:
    enabled: true
    default-schema: cinemaland
file:
  upload-directory: ./uploads/
