server:
  port: 3000
spring:
  messages:
    basename: messages
    encoding: UTF-8
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    # Never commit real passwords: set DB_PASSWORD as an environment variable
    url: ${DB_URL:jdbc:mysql://localhost:3306/cinemaland}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    # Set FLYWAY_ENABLED=true on a NEW, empty database to create all tables automatically
    enabled: ${FLYWAY_ENABLED:false}
    default-schema: cinemaland
  web:
    resources:
      static-locations: classpath:/static/
file:
  # Folder where uploaded images are stored (created automatically)
  upload-directory: ${UPLOAD_DIR:./uploads/}
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8400,http://localhost:8080}
